<!doctype html>
<!-- Only when you cannot load a script. The loader is preferred: it sizes the
     frame to the card and grants fullscreen for you. A hand-written frame needs
     allow="fullscreen" allowfullscreen, or the fullscreen button is not shown. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DigitalDon widget: plain iframe</title>
</head>
<body>
  <iframe src="https://widget.digitaldon.net/?chain=solana&address=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v&tools=holders"
          allow="fullscreen" allowfullscreen
          style="width: 100%; max-width: 520px; height: 520px; border: 0"></iframe>
</body>
</html>
